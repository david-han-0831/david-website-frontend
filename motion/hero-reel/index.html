<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero Reel — Blueprint to Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet" />
<!-- 레포의 gsap·three 를 그대로 쓴다 (render.mjs 가 frontend 루트를 정적 서버로 연다) -->
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06070a; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas { position: absolute; inset: 0; display: block; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(110% 85% at 50% 48%, transparent 45%, rgba(0,0,0,.72) 100%); pointer-events: none; }
  .grain { position: absolute; inset: -50%; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .hud { position: absolute; left: 96px; bottom: 84px; font: 500 20px 'JetBrains Mono', monospace; letter-spacing: .08em; color: rgba(236,239,248,.9); }
  .hud .labels { position: relative; height: 28px; width: 420px; overflow: hidden; }
  .hud .labels span { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; }
  .hud .labels b { color: #7b93ff; font-weight: 500; margin-right: 16px; }
  .hud .track { display: grid; grid-template-columns: repeat(4, 64px); gap: 8px; margin-top: 18px; }
  .hud .track i { display: block; height: 2px; background: rgba(236,239,248,.16); overflow: hidden; }
  .hud .track i b { display: block; height: 100%; background: #7b93ff; transform-origin: left; transform: scaleX(0); }
  .sign { position: absolute; right: 96px; bottom: 84px; font: 400 18px 'JetBrains Mono', monospace; letter-spacing: .08em; color: rgba(236,239,248,.45); }
</style>
</head>
<body>
<div id="stage">
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="hud">
    <div class="labels">
      <span><b>01</b>PLAN</span>
      <span><b>02</b>DESIGN</span>
      <span><b>03</b>BUILD</span>
      <span><b>04</b>SHIP</span>
    </div>
    <div class="track"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
  </div>
  <div class="sign">HAN-DAVID.COM</div>
</div>

<script type="module">
import * as THREE from 'three'
import { Line2 } from 'three/addons/lines/Line2.js'
import { LineGeometry } from 'three/addons/lines/LineGeometry.js'
import { LineMaterial } from 'three/addons/lines/LineMaterial.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const W = 1920, H = 1080, DURATION = 10
const BLUE = new THREE.Color(0.55, 0.66, 3.2) // 블룸에 걸리도록 1 을 넘기는 선 색
const BG = 0x06070a

await Promise.all([
  document.fonts.load('600 64px "Bricolage Grotesque"'),
  document.fonts.load('600 40px Inter'),
  document.fonts.load('400 40px Inter'),
  document.fonts.load('500 24px "JetBrains Mono"'),
])

// ── 렌더러 ──────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(W, H)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.localClippingEnabled = true
document.getElementById('stage').prepend(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(BG)
scene.fog = new THREE.FogExp2(BG, 0.075)
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 1.0

const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 60)

const key = new THREE.DirectionalLight(0xffffff, 2.2)
key.position.set(-3, 3, 4)
const rim = new THREE.DirectionalLight(0x6f86ff, 5)
rim.position.set(3.5, 1.5, -3)
const fill = new THREE.DirectionalLight(0x9aa8ff, 0.4)
fill.position.set(0, -2, 3)
scene.add(key, rim, fill)

const target = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType })
const composer = new EffectComposer(renderer, target)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.55, 0.9)
composer.addPass(bloom)
composer.addPass(new OutputPass())

// ── 도구 ────────────────────────────────────────
const DEV = { w: 0.78, h: 1.6, d: 0.085, r: 0.12 }
const SCR = { w: 0.72, h: 1.54, r: 0.095 }

function roundedRectPoints(w, h, r, z = 0, seg = 10) {
  const pts = []
  const corners = [
    [w / 2 - r, h / 2 - r, 0],
    [-w / 2 + r, h / 2 - r, Math.PI / 2],
    [-w / 2 + r, -h / 2 + r, Math.PI],
    [w / 2 - r, -h / 2 + r, (Math.PI * 3) / 2],
  ]
  for (const [cx, cy, a0] of corners) for (let i = 0; i <= seg; i++) {
    const a = a0 + (i / seg) * (Math.PI / 2)
    pts.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r, z)
  }
  pts.push(pts[0], pts[1], pts[2])
  return pts
}

function roundedRectGeometry(w, h, r) {
  const s = new THREE.Shape()
  s.moveTo(-w / 2 + r, -h / 2)
  s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r)
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2)
  s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r)
  s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2)
  const g = new THREE.ShapeGeometry(s, 16)
  const p = g.attributes.position, uv = g.attributes.uv
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h)
  return g
}

function line(points, { width = 2, color = BLUE, opacity = 1, dashed = false } = {}) {
  const g = new LineGeometry()
  g.setPositions(points)
  const m = new LineMaterial({ color, linewidth: width, transparent: true, opacity, dashed, dashSize: 0.03, gapSize: 0.02, depthWrite: false })
  m.resolution.set(W, H)
  const l = new Line2(g, m)
  l.computeLineDistances()
  l.userData.segments = points.length / 3 - 1
  return l
}
// 선을 앞에서부터 p 만큼만 그린다
const drawTo = (l, p) => { l.geometry.instanceCount = Math.max(0, Math.round(l.userData.segments * p)) }

function textSprite(text, { size = 26, color = '#8fa2ff', scale = 0.0011 } = {}) {
  const c = document.createElement('canvas')
  const ctx = c.getContext('2d')
  ctx.font = `500 ${size}px "JetBrains Mono"`
  c.width = Math.ceil(ctx.measureText(text).width) + 16
  c.height = size + 16
  ctx.font = `500 ${size}px "JetBrains Mono"`
  ctx.fillStyle = color
  ctx.textBaseline = 'middle'
  ctx.fillText(text, 8, c.height / 2)
  const tex = new THREE.CanvasTexture(c)
  tex.colorSpace = THREE.SRGBColorSpace
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 }))
  s.scale.set(c.width * scale, c.height * scale, 1)
  return s
}

// ── 화면 UI 레이어 (캔버스로 그림) ───────────────────
const CW = 1024, CH = Math.round(1024 * SCR.h / SCR.w)
const R = (ctx, x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r) }
// 레이어 공통 레이아웃
const L = {
  status: [64, 56, 896, 40],
  hello: [64, 150, 520, 44],
  title: [64, 206, 700, 72],
  card: [64, 330, 896, 560],
  actions: [0, 1, 2, 3].map((i) => [64 + i * 232, 940, 200, 200]),
  recent: [64, 1210, 300, 48],
  rows: [0, 1, 2, 3].map((i) => [64, 1290 + i * 150, 896, 124]),
  tab: [64, CH - 190, 896, 120],
}

function layerBlueprint(ctx) {
  ctx.strokeStyle = 'rgba(123,147,255,.18)'; ctx.lineWidth = 2
  for (let x = 0; x <= CW; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke() }
  for (let y = 0; y <= CH; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke() }
  ctx.setLineDash([18, 12]); ctx.strokeStyle = 'rgba(143,162,255,.95)'; ctx.lineWidth = 4
  const boxes = [L.status, L.hello, L.title, L.card, ...L.actions, L.recent, ...L.rows, L.tab]
  for (const [x, y, w, h] of boxes) { R(ctx, x, y, w, h, 20); ctx.stroke() }
  ctx.setLineDash([])
  ctx.fillStyle = 'rgba(143,162,255,1)'; ctx.font = '500 30px "JetBrains Mono"'
  ctx.fillText('896 × 560', 80, 322); ctx.fillText('col-3 × 4', 80, 932); ctx.fillText('list · 4', 80, 1282)
}
function layerLayout(ctx) {
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 3
  const boxes = [L.card, ...L.actions, ...L.rows, L.tab]
  for (const [x, y, w, h] of boxes) { R(ctx, x, y, w, h, 36); ctx.fill(); ctx.stroke() }
  ctx.fillStyle = 'rgba(255,255,255,.14)'
  R(ctx, 64, 160, 300, 26, 13); ctx.fill(); R(ctx, 64, 216, 560, 52, 26); ctx.fill()
  for (const [x, y] of L.rows) { R(ctx, x + 150, y + 36, 320, 22, 11); ctx.fill(); R(ctx, x + 150, y + 72, 200, 18, 9); ctx.fill() }
}
function layerVisual(ctx) {
  const [cx, cy, cw, ch] = L.card
  const g = ctx.createLinearGradient(cx, cy, cx + cw, cy + ch)
  g.addColorStop(0, '#2747f5'); g.addColorStop(0.55, '#5b3df5'); g.addColorStop(1, '#9b5cf6')
  R(ctx, cx, cy, cw, ch, 44); ctx.fillStyle = g; ctx.fill()
  ctx.save(); R(ctx, cx, cy, cw, ch, 44); ctx.clip()
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.beginPath(); ctx.arc(cx + cw - 80, cy + 60, 260, 0, 7); ctx.fill()
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.beginPath(); ctx.arc(cx + cw - 20, cy + ch, 220, 0, 7); ctx.fill()
  ctx.restore()
  const colors = ['#2747f5', '#16a34a', '#f59e0b', '#ec4899']
  L.actions.forEach(([x, y, w, h], i) => {
    R(ctx, x, y, w, h, 48); ctx.fillStyle = '#181b22'; ctx.fill()
    ctx.beginPath(); ctx.arc(x + w / 2, y + 82, 40, 0, 7); ctx.fillStyle = colors[i]; ctx.fill()
  })
  L.rows.forEach(([x, y, w, h], i) => {
    R(ctx, x, y, w, h, 32); ctx.fillStyle = '#14171d'; ctx.fill()
    R(ctx, x + 28, y + 26, 72, 72, 22); ctx.fillStyle = colors[i]; ctx.globalAlpha = 0.22; ctx.fill(); ctx.globalAlpha = 1
  })
  const [tx, ty, tw, th] = L.tab
  R(ctx, tx, ty, tw, th, 60); ctx.fillStyle = '#181b22'; ctx.fill()
  R(ctx, tx + 16, ty + 16, 260, th - 32, 44); ctx.fillStyle = '#ffffff'; ctx.fill()
}
function layerData(ctx) {
  ctx.fillStyle = '#8a909b'; ctx.font = '500 34px Inter'; ctx.fillText('Good morning, David', 64, 186)
  ctx.fillStyle = '#ffffff'; ctx.font = '600 64px "Bricolage Grotesque"'; ctx.fillText('Your studio', 64, 262)
  const [cx, cy, cw] = L.card
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '500 32px Inter'; ctx.fillText('Revenue this month', cx + 52, cy + 92)
  ctx.fillStyle = '#ffffff'; ctx.font = '600 104px "Bricolage Grotesque"'; ctx.fillText('$48,210', cx + 48, cy + 206)
  ctx.fillStyle = '#a7f3c0'; ctx.font = '600 32px Inter'; ctx.fillText('▲ 12.4%', cx + 52, cy + 262)
  const pts = [0.62, 0.55, 0.58, 0.44, 0.48, 0.36, 0.40, 0.26, 0.30, 0.16]
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.beginPath()
  pts.forEach((v, i) => { const x = cx + 52 + i * ((cw - 104) / (pts.length - 1)); const y = cy + 300 + v * 360; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y) })
  ctx.stroke()
  ctx.fillStyle = '#ffffff'; ctx.font = '600 30px Inter'; ctx.textAlign = 'center'
  ;['Book', 'Pay', 'Chat', 'Stats'].forEach((t, i) => { const [x, y, w] = L.actions[i]; ctx.fillText(t, x + w / 2, y + 170) })
  ctx.textAlign = 'left'
  ctx.font = '600 40px "Bricolage Grotesque"'; ctx.fillText('Recent', 64, 1250)
  const rows = [['Studio booking', 'Oct 17 · 10:30', '+$48.00'], ['Monthly plan', 'Oct 15', '+$120.00'], ['Refund', 'Oct 12', '−$24.00'], ['Workshop', 'Oct 09', '+$96.00']]
  L.rows.forEach(([x, y, w], i) => {
    ctx.fillStyle = '#ffffff'; ctx.font = '600 34px Inter'; ctx.fillText(rows[i][0], x + 128, y + 58)
    ctx.fillStyle = '#8a909b'; ctx.font = '400 28px Inter'; ctx.fillText(rows[i][1], x + 128, y + 96)
    ctx.fillStyle = rows[i][2].startsWith('+') ? '#4ade80' : '#f87171'; ctx.font = '600 34px Inter'; ctx.textAlign = 'right'; ctx.fillText(rows[i][2], x + w - 32, y + 76); ctx.textAlign = 'left'
  })
  const [tx, ty, , th] = L.tab
  ctx.fillStyle = '#0c0d10'; ctx.font = '600 32px Inter'; ctx.fillText('Home', tx + 100, ty + th / 2 + 11)
}

function makeTexture(draw, bg) {
  const c = document.createElement('canvas'); c.width = CW; c.height = CH
  const ctx = c.getContext('2d')
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, CW, CH) }
  ;[].concat(draw).forEach((d) => d(ctx))
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  return t
}

// ── 기기 ────────────────────────────────────────
const device = new THREE.Group()
scene.add(device)

const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), -2) // y <= constant 인 부분만 보임

// 화면 (완성 상태) — glTF UV 는 위아래가 뒤집혀 있어 flipY 를 끈다
const screenTex = makeTexture([layerVisual, layerData], '#0b0d12')
screenTex.flipY = false
const screenMat = new THREE.MeshBasicMaterial({ map: screenTex, transparent: true, opacity: 0, toneMapped: false })

// Blender 로 만든 휴대폰 (motion/hero-reel/phone/build_phone.py)
const phone = (await new GLTFLoader().loadAsync('/motion/hero-reel/phone/phone.glb')).scene
phone.traverse((o) => {
  if (!o.isMesh) return
  if (o.name === 'Screen') {
    o.material = screenMat
    return
  }
  // 솔리드가 아래부터 차오르는 연출: 모든 부품에 같은 절단면
  o.material = o.material.clone()
  o.material.clippingPlanes = [clip]
  o.material.envMapIntensity = o.material.metalness > 0.5 ? 1.3 : 1
})
device.add(phone)
// 화면 위 유리 반사
const glass = new THREE.Mesh(roundedRectGeometry(SCR.w, SCR.h, SCR.r), new THREE.MeshPhysicalMaterial({ color: 0x000000, metalness: 0, roughness: 0.05, transparent: true, opacity: 0, clearcoat: 1 }))
glass.position.z = DEV.d / 2 + 0.003
device.add(glass)

// 설계선: 앞면 윤곽 · 뒷면 윤곽 · 모서리 깊이선 · 중심축 · 치수
const front = line(roundedRectPoints(DEV.w, DEV.h, DEV.r, DEV.d / 2 + 0.002, 12), { width: 2.5 })
const back = line(roundedRectPoints(DEV.w, DEV.h, DEV.r, -DEV.d / 2, 12), { width: 1.5, opacity: 0 })
const inner = line(roundedRectPoints(SCR.w, SCR.h, SCR.r, DEV.d / 2 + 0.002, 10), { width: 1.2, opacity: 0 })
const depth = new THREE.Group()
for (const [x, y] of [[1, 1], [-1, 1], [-1, -1], [1, -1]]) {
  const px = x * (DEV.w / 2 - DEV.r * 0.3), py = y * (DEV.h / 2 - DEV.r * 0.3)
  depth.add(line([px, py, DEV.d / 2, px, py, -DEV.d / 2], { width: 1.5, opacity: 0 }))
}
const axes = new THREE.Group()
axes.add(line([0, -DEV.h / 2 - 0.35, 0, 0, DEV.h / 2 + 0.35, 0], { width: 1, dashed: true, opacity: 0 }))
axes.add(line([-DEV.w / 2 - 0.35, 0, 0, DEV.w / 2 + 0.35, 0, 0], { width: 1, dashed: true, opacity: 0 }))
const dims = new THREE.Group()
const tw = DEV.h / 2 + 0.14, tr = DEV.w / 2 + 0.14
dims.add(line([-DEV.w / 2, tw, 0, DEV.w / 2, tw, 0], { width: 1.2, opacity: 0 }))
dims.add(line([-DEV.w / 2, tw - 0.03, 0, -DEV.w / 2, tw + 0.03, 0], { width: 1.2, opacity: 0 }))
dims.add(line([DEV.w / 2, tw - 0.03, 0, DEV.w / 2, tw + 0.03, 0], { width: 1.2, opacity: 0 }))
dims.add(line([tr, -DEV.h / 2, 0, tr, DEV.h / 2, 0], { width: 1.2, opacity: 0 }))
dims.add(line([tr - 0.03, -DEV.h / 2, 0, tr + 0.03, -DEV.h / 2, 0], { width: 1.2, opacity: 0 }))
dims.add(line([tr - 0.03, DEV.h / 2, 0, tr + 0.03, DEV.h / 2, 0], { width: 1.2, opacity: 0 }))
const dimW = textSprite('78.0 mm'); dimW.position.set(0.16, tw + 0.07, 0)
const dimH = textSprite('160.0 mm'); dimH.position.set(tr + 0.2, 0.08, 0)
device.add(front, back, inner, depth, axes, dims, dimW, dimH)

// 단면 스캔 링: 솔리드가 차오르는 높이를 따라 이동
const scan = line([-DEV.w / 2, 0, -DEV.d / 2, DEV.w / 2, 0, -DEV.d / 2, DEV.w / 2, 0, DEV.d / 2, -DEV.w / 2, 0, DEV.d / 2, -DEV.w / 2, 0, -DEV.d / 2], { width: 3, opacity: 0 })
device.add(scan)

// 분해된 화면 레이어 (설계 → 레이아웃 → 비주얼 → 데이터)
const layerDraws = [layerBlueprint, layerLayout, layerVisual, layerData]
const layers = layerDraws.map((draw, i) => {
  const g = new THREE.Group()
  const mat = new THREE.MeshBasicMaterial({ map: makeTexture(draw, i === 0 ? 'rgba(20,28,70,.35)' : null), transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, toneMapped: false })
  g.add(new THREE.Mesh(roundedRectGeometry(SCR.w, SCR.h, SCR.r), mat))
  const edge = line(roundedRectPoints(SCR.w, SCR.h, SCR.r, 0, 10), { width: 1.5, opacity: 0 })
  g.add(edge)
  g.position.z = DEV.d / 2 + 0.004
  g.userData = { mat, edge }
  device.add(g)
  return g
})

// 바닥 설계 격자
const floorMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uOpacity: { value: 0.6 }, uColor: { value: new THREE.Color(0.35, 0.45, 1.6) } },
  vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `varying vec2 vP; uniform float uOpacity; uniform vec3 uColor;
    float grid(vec2 p, float s){ vec2 g = abs(fract(p / s - .5) - .5) / fwidth(p / s); return 1. - min(min(g.x, g.y), 1.); }
    void main(){ float f = max(grid(vP, .1) * .35, grid(vP, .5)); float fade = smoothstep(3.2, .2, length(vP));
      gl_FragColor = vec4(uColor, f * fade * uOpacity); }`,
})
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), floorMat)
floor.rotation.x = -Math.PI / 2
floor.position.y = -DEV.h / 2 - 0.28
scene.add(floor)

// 뒤쪽 푸른 후광
const haloTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512
  const x = c.getContext('2d'); const g = x.createRadialGradient(256, 256, 0, 256, 256, 256)
  g.addColorStop(0, 'rgba(70,100,255,.9)'); g.addColorStop(0.4, 'rgba(60,70,240,.28)'); g.addColorStop(1, 'rgba(40,40,200,0)')
  x.fillStyle = g; x.fillRect(0, 0, 512, 512)
  return new THREE.CanvasTexture(c)
})()
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }))
halo.scale.set(4.2, 4.2, 1)
halo.position.set(0, 0.1, -1.2)
scene.add(halo)

// ── 카메라 (타깃 주위 구면 좌표) ─────────────────────
const cam = { yaw: 0, pitch: 0, dist: 4.6, tx: 0, ty: 0, tz: 0 }
function placeCamera() {
  const yaw = THREE.MathUtils.degToRad(cam.yaw), pitch = THREE.MathUtils.degToRad(cam.pitch)
  camera.position.set(cam.tx + Math.sin(yaw) * Math.cos(pitch) * cam.dist, cam.ty + Math.sin(pitch) * cam.dist, cam.tz + Math.cos(yaw) * Math.cos(pitch) * cam.dist)
  camera.lookAt(cam.tx, cam.ty, cam.tz)
}

// ── 타임라인 ────────────────────────────────────
// 앞면 설계선은 처음과 끝 모두 그려진 상태 (반복 이음새)
const st = { plan: 1, clipY: -1.2, scanOn: 0, flash: 0 }
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } })
const hudLabels = [...document.querySelectorAll('.hud .labels span')]
const hudBars = [...document.querySelectorAll('.hud .track b')]
const phase = (i, from, to) => {
  tl.fromTo(hudLabels[i], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, from)
  if (i < 3) tl.to(hudLabels[i], { opacity: 0, y: -20, duration: 0.35, ease: 'expo.in' }, to - 0.3)
  tl.fromTo(hudBars[i], { scaleX: 0 }, { scaleX: 1, duration: to - from, ease: 'none' }, from)
}
phase(0, 0.4, 2.0); phase(1, 2.0, 5.0); phase(2, 5.0, 7.1); phase(3, 7.1, 9.3)
const mats = (group) => group.children.map((l) => l.material)

// 0.0 – 2.0  PLAN: 정면 설계도에 중심축과 치수가 그어진다
tl.fromTo(cam, { yaw: 0, pitch: 0, dist: 4.9, tx: 0, tz: 0 }, { yaw: -6, pitch: 3, dist: 4.3, duration: 2.2, ease: 'power1.inOut' }, 0)
tl.to(mats(axes), { opacity: 0.55, duration: 0.6 }, 0.2)
tl.to(mats(dims), { opacity: 0.9, duration: 0.5, stagger: 0.05 }, 0.6)
tl.to([dimW.material, dimH.material], { opacity: 1, duration: 0.4 }, 0.9)

// 2.0 – 5.0  DESIGN: 와이어프레임 입체로 돌아가고, 화면 레이어가 분해되어 떠오른다
tl.to(cam, { yaw: -32, pitch: 12, dist: 4.2, duration: 1.3 }, 1.9)
tl.to([back.material, inner.material, ...mats(depth)], { opacity: 0.8, duration: 0.6 }, 2.0)
tl.to([...mats(axes), ...mats(dims), dimW.material, dimH.material], { opacity: 0, duration: 0.5 }, 2.6)
tl.to(cam, { yaw: 46, pitch: 14, dist: 4.7, tz: 0.42, duration: 2.0 }, 3.0)
layers.forEach((g, i) => {
  const at = 2.9 + i * 0.35
  tl.to(g.position, { z: DEV.d / 2 + 0.2 + i * 0.2, duration: 1.1, ease: 'expo.out' }, at)
  tl.to(g.userData.mat, { opacity: i === 0 ? 0.95 : 1, duration: 0.6, ease: 'power1.out' }, at)
  tl.to(g.userData.edge.material, { opacity: 0.9, duration: 0.4 }, at)
})

// 5.0 – 7.1  BUILD: 솔리드가 아래부터 차오르고, 레이어가 화면으로 합쳐진다
tl.to(cam, { yaw: 24, pitch: 8, dist: 4.1, tz: 0, duration: 1.8 }, 5.0)
tl.set(st, { scanOn: 1 }, 5.55)
tl.fromTo(st, { clipY: -DEV.h / 2 - 0.02 }, { clipY: DEV.h / 2 + 0.02, duration: 1.2, ease: 'power2.inOut' }, 5.55)
tl.set(st, { scanOn: 0 }, 6.8)
tl.to([front.material, back.material, inner.material, ...mats(depth)], { opacity: 0, duration: 0.5 }, 6.4)
tl.to(floorMat.uniforms.uOpacity, { value: 0, duration: 1.0 }, 5.4)
layers.slice().reverse().forEach((g, i) => {
  tl.to(g.position, { z: DEV.d / 2 + 0.004, duration: 0.7, ease: 'power3.inOut' }, 4.95 + i * 0.1)
  tl.to([g.userData.mat, g.userData.edge.material], { opacity: 0, duration: 0.3, ease: 'none' }, 5.7 + i * 0.1)
})
tl.to(screenMat, { opacity: 1, duration: 0.4, ease: 'none' }, 6.45)
tl.to(glass.material, { opacity: 0.35, duration: 0.4, ease: 'none' }, 6.5)
tl.fromTo(st, { flash: 0 }, { flash: 1, duration: 0.15, ease: 'power2.out', yoyo: true, repeat: 1 }, 6.75)

// 7.1 – 9.3  SHIP: 조명 아래 완성품, 빛이 표면을 쓸고 지나간다
tl.to(cam, { yaw: -10, pitch: 4, dist: 3.55, duration: 2.4, ease: 'power1.inOut' }, 7.0)
tl.fromTo(device.rotation, { y: 0 }, { y: -0.32, duration: 2.6, ease: 'power1.inOut' }, 6.9)
tl.fromTo(key.position, { x: -3 }, { x: 3.2, duration: 2.4, ease: 'power1.inOut' }, 7.0)
tl.to(halo.material, { opacity: 0.85, duration: 1.2, ease: 'power1.out' }, 6.8)

// 9.2 – 10  완성품이 위에서부터 스캔되며 설계선으로 돌아간다 (첫 프레임과 같은 상태)
tl.to(cam, { yaw: 0, pitch: 0, dist: 4.9, tx: 0, tz: 0, duration: 0.8, ease: 'power2.inOut' }, 9.2)
tl.to(device.rotation, { y: 0, duration: 0.8, ease: 'power2.inOut' }, 9.2)
tl.to(key.position, { x: -3, duration: 0.8 }, 9.2)
tl.to(halo.material, { opacity: 0, duration: 0.6 }, 9.2)
tl.to(front.material, { opacity: 1, duration: 0.3 }, 9.2)
tl.to([screenMat, glass.material], { opacity: 0, duration: 0.35, ease: 'none' }, 9.25)
tl.set(st, { scanOn: 1 }, 9.3)
tl.to(st, { clipY: -DEV.h / 2 - 0.02, duration: 0.6, ease: 'power2.in' }, 9.3)
tl.set(st, { scanOn: 0 }, 9.92)
tl.to(floorMat.uniforms.uOpacity, { value: 0.6, duration: 0.7 }, 9.3)
tl.to(hudBars, { scaleX: 0, duration: 0.4, ease: 'power2.in', transformOrigin: 'right' }, 9.4)
tl.to(hudLabels[3], { opacity: 0, y: -20, duration: 0.35, ease: 'expo.in' }, 9.45)
tl.to({}, { duration: 0.01 }, DURATION - 0.01)

// ── 매 프레임 적용 ───────────────────────────────
const grain = document.querySelector('.grain')
function apply(t) {
  drawTo(front, st.plan)
  clip.constant = st.clipY
  scan.position.y = st.clipY
  scan.material.opacity = st.scanOn
  for (const m of [front.material, inner.material]) m.linewidth = 2.5 + st.flash * 5
  bloom.strength = 0.6 + st.flash * 1.4
  placeCamera()
  // 그레인은 프레임마다 위치를 바꾼다 (시간으로 정해지므로 렌더할 때마다 같음)
  const f = Math.floor(t * 24)
  grain.style.transform = `translate(${((f * 37) % 200) - 100}px, ${((f * 53) % 200) - 100}px)`
}

function seek(t) {
  tl.seek(t, false)
  apply(t)
  composer.render()
}

window.__reel = { seek, duration: DURATION }
window.__ready = true

if (!location.search.includes('render')) {
  const t0 = performance.now()
  const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop) }
  loop()
} else {
  seek(0)
}
</script>
</body>
</html>
